# ==============================================================================
# AETHER — Hyprlock Configuration
# ==============================================================================

source = ./aether-colors.conf

$font = Sans Serif
$scripts = /home/omii/Projects/aether-desktop/hyprlock/scripts

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 4, easeOutQuint
    animation = fadeOut, 1, 3, easeOutQuint
    animation = inputFieldDots, 1, 2, easeOutQuint
}

# --- Background ---
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    vibrancy = 0.2
    vibrancy_darkness = 0.2
    color = $bg_dark
}

# --- Branding Header ---
label {
    monitor =
    text = A E T H E R
    color = $accent_lavender
    font_size = 14
    font_family = $font
    position = 0, -80
    halign = center
    valign = top
}

# --- Cinematic Clock ---
label {
    monitor =
    text = $TIME
    color = $lock_time
    font_size = 80
    font_family = $font
    position = 0, -110
    halign = center
    valign = top
}

# --- Date ---
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $lock_date
    font_size = 15
    font_family = $font
    position = 0, -215
    halign = center
    valign = top
}

# --- Native PAM Password Input Field ---
input-field {
    monitor =
    size = 300, 48
    outline_thickness = 1
    inner_color = $bg_card_alpha
    outer_color = $lock_outline
    check_color = $lock_check
    fail_color = $lock_fail

    font_color = $lock_font
    fade_on_empty = false
    rounding = 12

    font_family = $font
    placeholder_text = <span foreground="##8586A5">Enter Password</span>
    fail_text = <i>Authentication Failed ($ATTEMPTS)</i>

    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true

    position = 0, -20
    halign = center
    valign = center
}

# --- Keyboard Layout Indicator ---
label {
    monitor =
    text = $LAYOUT
    font_size = 12
    font_family = $font
    color = $lock_layout
    position = 0, -75
    halign = center
    valign = center
}

# --- Media Marquee Ticker ---
label {
    monitor =
    text = cmd[update:1000] $scripts/media-status.sh
    color = $lock_media
    font_size = 13
    font_family = $font
    position = 0, -280
    halign = center
    valign = center
}

# --- Media Controls (Previous, Play/Pause, Next) ---
label {
    monitor =
    text = cmd[update:1000] $scripts/media-status.sh icon-prev
    font_size = 22
    color = $lock_media
    position = -45, -325
    halign = center
    valign = center
    onclick = $scripts/media-status.sh previous
}

label {
    monitor =
    text = cmd[update:1000] $scripts/media-status.sh icon-play
    font_size = 20
    color = $lock_media
    position = 0, -325
    halign = center
    valign = center
    onclick = $scripts/media-status.sh play-pause
}

label {
    monitor =
    text = cmd[update:1000] $scripts/media-status.sh icon-next
    font_size = 22
    color = $lock_media
    position = 45, -325
    halign = center
    valign = center
    onclick = $scripts/media-status.sh next
}