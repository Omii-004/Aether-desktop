[General]
# Clock & Date formats (Qt format syntax)
TimeFormat="hh:mm"
DateFormat="dddd, dd MMMM yyyy"

# Interface copy
Greeting="Welcome back"
Subtitle="Enter your credentials to continue"
Tagline="A quiet space between worlds"

# --- Background configuration ---
# BackgroundMode options: "gradient", "image", or "video" (default: "gradient")
BackgroundMode="gradient"

# Wallpaper path:
# Absolute file path required (e.g., "/usr/share/backgrounds/wallpaper.png").
# Note: If an image or video fails to load or is invalid, the greeter gracefully falls back to the baseline gradient.
BackgroundImage=""
BackgroundVideo=""

# BackgroundFit options:
# Images support: "Cover", "Contain", "Center" (unscaled 1:1), "Fill" (stretch)
# Videos support: "Cover", "Contain", "Fill" (Stretch). (Note: "Center" falls back to "Cover" for video)
BackgroundFit="Cover"

# BackgroundPosition options (Images only):
# "Center", "Top", "Bottom", "Left", "Right", "TopLeft", "TopRight", "BottomLeft", "BottomRight"
# (Note: VideoOutput always fills its anchored area; position alignment applies to static images)
BackgroundPosition="Center"

# BackgroundDim: Atmospheric contrast scrim opacity (0.00 to 0.60). Default: 0.15
BackgroundDim="0.15"

# Atmosphere toggles
EnableGlow=true

# --- Audio configuration ---
PlayMusic=false
MusicFile=""
Volume=0.5